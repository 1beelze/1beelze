<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550">
<defs>
  <filter id="cGlow" x="-22%" y="-18%" width="144%" height="136%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="exp"/>
    <feGaussianBlur in="exp" stdDeviation="7" result="blur"/>
    <feFlood flood-color="#FF1744" flood-opacity="1" result="red"/>
    <feComposite in="red" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="rGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="11" result="blur"/>
    <feFlood flood-color="#FF1744" flood-opacity="1" result="red"/>
    <feComposite in="red" in2="blur" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sGlow" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feFlood flood-color="#FF1744" flood-opacity="1" result="red"/>
    <feComposite in="red" in2="blur" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tGlow" x="-32%" y="-80%" width="164%" height="260%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="tex"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="b1"/>
    <feFlood flood-color="#FF1744" flood-opacity="1" result="r1"/>
    <feComposite in="r1" in2="b1" operator="in" result="g1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b2"/>
    <feFlood flood-color="#FF9988" flood-opacity="0.9" result="r2"/>
    <feComposite in="r2" in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="tex"/></feMerge>
  </filter>
  <filter id="t2Glow" x="-32%" y="-80%" width="164%" height="260%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b1"/>
    <feFlood flood-color="#FF1744" flood-opacity="1" result="r1"/>
    <feComposite in="r1" in2="b1" operator="in" result="g1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b2"/>
    <feFlood flood-color="#FF9988" flood-opacity="0.7" result="r2"/>
    <feComposite in="r2" in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="tF" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FFBBBB"/>
    <stop offset="15%"  stop-color="#FF5566"/>
    <stop offset="40%"  stop-color="#FF1744"/>
    <stop offset="60%"  stop-color="#CC0030"/>
    <stop offset="82%"  stop-color="#880022"/>
    <stop offset="100%" stop-color="#3E000F"/>
  </linearGradient>
  <linearGradient id="tF2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FF8888"/>
    <stop offset="40%"  stop-color="#FF1744"/>
    <stop offset="100%" stop-color="#550015"/>
  </linearGradient>
  <radialGradient id="bgR" cx="50%" cy="42%" r="52%">
    <stop offset="0%"   stop-color="#1A0008" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="rc"><circle cx="250" cy="202" r="198"/></clipPath>
</defs>

<rect width="500" height="550" fill="#000000"/>
<circle cx="250" cy="202" r="196" fill="url(#bgR)"/>

