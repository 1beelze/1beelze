  <text x="355" y="18">1<tspan dy="14" x="355">0</tspan><tspan dy="14" x="355">F</tspan><tspan dy="14" x="355">0</tspan><tspan dy="14" x="355">A</tspan><tspan dy="14" x="355">1</tspan><tspan dy="14" x="355">0</tspan><tspan dy="14" x="355">B</tspan><tspan dy="14" x="355">1</tspan><tspan dy="14" x="355">0</tspan><tspan dy="14" x="355">C</tspan><tspan dy="14" x="355">1</tspan><tspan dy="14" x="355">0</tspan><tspan dy="14" x="355">1</tspan></text>
  <text x="390" y="32">0<tspan dy="14" x="390">1</tspan><tspan dy="14" x="390">E</tspan><tspan dy="14" x="390">0</tspan><tspan dy="14" x="390">F</tspan><tspan dy="14" x="390">1</tspan><tspan dy="14" x="390">0</tspan><tspan dy="14" x="390">A</tspan><tspan dy="14" x="390">1</tspan><tspan dy="14" x="390">0</tspan><tspan dy="14" x="390">1</tspan><tspan dy="14" x="390">0</tspan><tspan dy="14" x="390">B</tspan><tspan dy="14" x="390">1</tspan></text>
  <text x="422" y="10">F<tspan dy="14" x="422">0</tspan><tspan dy="14" x="422">1</tspan><tspan dy="14" x="422">A</tspan><tspan dy="14" x="422">0</tspan><tspan dy="14" x="422">B</tspan><tspan dy="14" x="422">1</tspan><tspan dy="14" x="422">C</tspan><tspan dy="14" x="422">0</tspan><tspan dy="14" x="422">1</tspan><tspan dy="14" x="422">0</tspan><tspan dy="14" x="422">F</tspan><tspan dy="14" x="422">1</tspan><tspan dy="14" x="422">0</tspan></text>
</g>

