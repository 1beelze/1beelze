<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#200008"/>
      <stop offset="55%" stop-color="#130005"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="textFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9999"/>
      <stop offset="20%" stop-color="#FF4466"/>
      <stop offset="60%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880011"/>
    </linearGradient>
    <linearGradient id="hLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF1744" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#FF1744" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#FF1744" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#FF1744" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vLineL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF1744" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FF1744" stop-opacity="0.35"/>
      <stop offset="70%"  stop-color="#FF1744" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>

    <!-- Intense double-glow for main text -->
    <filter id="glow" x="-22%" y="-70%" width="144%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur18"/>
      <feFlood flood-color="#FF1744" flood-opacity="1" result="red"/>
      <feComposite in="red" in2="blur18" operator="in" result="outer"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur7"/>
      <feFlood flood-color="#FF6688" flood-opacity="0.9" result="pink"/>
      <feComposite in="pink" in2="blur7" operator="in" result="inner"/>

      <feMerge>
        <feMergeNode in="outer"/>
        <feMergeNode in="outer"/>
        <feMergeNode in="inner"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for subtitle -->
    <filter id="subGlow" x="-8%" y="-60%" width="116%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#FF5252" flood-opacity="0.7" result="red"/>
      <feComposite in="red" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for decorative text -->
    <filter id="dimGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FF1744" flood-opacity="0.5" result="red"/>
      <feComposite in="red" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#FF1744" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- ── BACKGROUND ──────────────────────────────── -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Radial center blush (subtle red warmth behind text) -->
  <ellipse cx="600" cy="145" rx="480" ry="160"
           fill="#FF1744" opacity="0.04"/>

  <!-- ── CORNER BRACKETS ────────────────────────── -->
  <g stroke="#FF1744" stroke-width="2.5" fill="none" stroke-opacity="0.65"
     stroke-linecap="square">
    <path d="M18,18 L18,62 M18,18 L72,18"/>
    <path d="M1182,18 L1182,62 M1182,18 L1128,18"/>
    <path d="M18,262 L18,218 M18,262 L72,262"/>
    <path d="M1182,262 L1182,218 M1182,262 L1128,262"/>
  </g>

  <!-- Vertical accent lines -->
  <rect x="80" y="18" width="1" height="244" fill="url(#vLineL)"/>
  <rect x="1119" y="18" width="1" height="244" fill="url(#vLineL)"/>

  <!-- Tick marks on vertical lines -->
  <g stroke="#FF1744" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="74" y1="70"  x2="87" y2="70"/>
    <line x1="74" y1="110" x2="87" y2="110"/>
    <line x1="74" y1="150" x2="87" y2="150"/>
    <line x1="74" y1="190" x2="87" y2="190"/>
    <line x1="1113" y1="70"  x2="1126" y2="70"/>
    <line x1="1113" y1="110" x2="1126" y2="110"/>
    <line x1="1113" y1="150" x2="1126" y2="150"/>
    <line x1="1113" y1="190" x2="1126" y2="190"/>
  </g>

  <!-- ── DECORATIVE TEXT ────────────────────────── -->
  <text x="95" y="42"
        font-family="'Courier New', Consolas, monospace"
        font-size="11" fill="#FF5252" opacity="0.55"
        filter="url(#dimGlow)">[1beelze@github ~]$ _</text>

  <text x="1105" y="42" text-anchor="end"
        font-family="'Courier New', Consolas, monospace"
        font-size="10" fill="#FF1744" opacity="0.45"
        letter-spacing="2">ACCESS GRANTED</text>

  <!-- Small circuit dots (decorative) -->
  <g fill="#FF1744" opacity="0.18">
    <circle cx="100" cy="240" r="2"/>
    <circle cx="115" cy="240" r="2"/>
    <circle cx="130" cy="240" r="2"/>
    <circle cx="1100" cy="240" r="2"/>
    <circle cx="1085" cy="240" r="2"/>
    <circle cx="1070" cy="240" r="2"/>
  </g>
  <g stroke="#FF1744" stroke-width="1" stroke-opacity="0.18" fill="none">
    <line x1="100" y1="240" x2="130" y2="240"/>
    <line x1="1070" y1="240" x2="1100" y2="240"/>
  </g>

  <!-- ── 3D TEXT: BEELZE ────────────────────────── -->
  <!-- 14 extrusion layers — dark deep-red shadow stack -->
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#0A0002"
        transform="translate(14,14)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#130004"
        transform="translate(13,13)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#1C0006"
        transform="translate(12,12)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#260009"
        transform="translate(11,11)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#30000C"
        transform="translate(10,10)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#3C0010"
        transform="translate(9,9)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#490014"
        transform="translate(8,8)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#570019"
        transform="translate(7,7)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#65001E"
        transform="translate(6,6)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#740023"
        transform="translate(5,5)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#840029"
        transform="translate(4,4)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#94002F"
        transform="translate(3,3)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#A60036"
        transform="translate(2,2)">BEELZE</text>
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14" fill="#BA003E"
        transform="translate(1,1)">BEELZE</text>

  <!-- Main text — gradient fill + intense glow -->
  <text text-anchor="middle" x="600" y="208"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="162" letter-spacing="14"
        fill="url(#textFill)" filter="url(#glow)">BEELZE</text>

  <!-- ── HORIZONTAL RULE ────────────────────────── -->
  <rect x="95" y="230" width="1010" height="1" fill="url(#hLine)"/>

  <!-- ── SUBTITLE ───────────────────────────────── -->
  <text text-anchor="middle" x="600" y="258"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="13" letter-spacing="5" fill="#FF5252"
        filter="url(#subGlow)">RED TEAM  ·  CVE RESEARCHER  ·  BUG BOUNTY HUNTER</text>
</svg>
